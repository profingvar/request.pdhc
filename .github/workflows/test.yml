name: pytest

# Ticket #376 (rollup #348) — first CI for request.pdhc. Runs the
# pytest suite on every push and PR. Mirrors the pattern established
# by plan.pdhc's test.yml (#341) and termbank's (#358).
#
# Ticket #380 (rollup #348) — the file-ignore + deselect list that
# used to live here (7 files, ~52 tests) was a workaround for a
# sibling-test env-pollution bug (test_dispatch_trigger /
# test_provider_lifecycle / test_sandbox_dispatch /
# test_webhook_dispatcher brute-overriding os.environ at import
# time). Fixed in the same commit that removes the ignores by
# (a) converting those import-time env writes to setdefault and
# (b) adding an autouse conftest fixture that pins
# app.config['AUTH_DISABLED']=True before every test. The whole
# suite now runs green.

on:
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches the Dockerfile base image (python:3.12-slim).
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Install dependencies
        working-directory: gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: gateway
        env:
          # Test config — conftest.py forces most of these on import,
          # but setting them here defends against a stray CI env.
          DATABASE_URL: 'sqlite:///test_request_pdhc.db'
          FLASK_ENV: 'development'
          AUTH_DISABLED: 'true'
          FLASK_SECRET_KEY: 'ci-only-not-secret'
          JWT_SECRET_KEY: 'ci-only-jwt'
          HMAC_SECRET: 'ci-only-hmac-secret-minimum-32-chars-ok'
          INTERNAL_SERVICE_KEY: 'ci-only-internal-key'
        run: PYTHONPATH=. pytest tests -q
