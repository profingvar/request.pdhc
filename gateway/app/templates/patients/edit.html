{% extends "base.html" %}
{% block title %}Edit Patient — request.pdhc{% endblock %}

{% block content %}
<h1>Edit Patient</h1>

{% set names = patient.get('name', []) %}
{% set name = names[0] if names else {} %}

<div class="card">
  <form method="POST" action="{{ url_for('patients_web.edit_patient', guid=patient.get('id', '')) }}">
    <div class="form-group">
      <label for="family">Family Name</label>
      <input type="text" id="family" name="family" class="form-control" value="{{ name.get('family', '') }}" required>
    </div>
    <div class="form-group">
      <label for="given">Given Name</label>
      <input type="text" id="given" name="given" class="form-control" value="{{ name.get('given', [''])|join(' ') }}" required>
    </div>
    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" name="gender" class="form-control">
        <option value="">Select...</option>
        <option value="male" {% if patient.get('gender') == 'male' %}selected{% endif %}>Male</option>
        <option value="female" {% if patient.get('gender') == 'female' %}selected{% endif %}>Female</option>
        <option value="other" {% if patient.get('gender') == 'other' %}selected{% endif %}>Other</option>
        <option value="unknown" {% if patient.get('gender') == 'unknown' %}selected{% endif %}>Unknown</option>
      </select>
    </div>
    <div class="form-group">
      <label for="birthDate">Birth Date</label>
      <input type="date" id="birthDate" name="birthDate" class="form-control" value="{{ patient.get('birthDate', '') }}">
    </div>
    <div class="form-group">
      <label for="telecom">Phone</label>
      <input type="tel" id="telecom" name="telecom" class="form-control"
             value="{{ patient.get('telecom', [{}])[0].get('value', '') if patient.get('telecom') else '' }}">
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" name="active" value="true" {% if patient.get('active', True) %}checked{% endif %}> Active
      </label>
    </div>
    <div style="display:flex; gap:0.5rem; margin-top:1rem;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('patients_web.view_patient', guid=patient.get('id', '')) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
