{% extends "base.html" %}
{% block title %}Create Patient — request.pdhc{% endblock %}

{% block content %}
<h1>Create Patient</h1>

<div class="card">
  <form method="POST" action="{{ url_for('patients_web.create_patient') }}">
    <div class="form-group">
      <label for="family">Family Name</label>
      <input type="text" id="family" name="family" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="given">Given Name</label>
      <input type="text" id="given" name="given" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" name="gender" class="form-control">
        <option value="">Select...</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
        <option value="unknown">Unknown</option>
      </select>
    </div>
    <div class="form-group">
      <label for="birthDate">Birth Date</label>
      <input type="date" id="birthDate" name="birthDate" class="form-control">
    </div>
    <div class="form-group">
      <label for="telecom">Phone</label>
      <input type="tel" id="telecom" name="telecom" class="form-control">
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" name="active" value="true" checked> Active
      </label>
    </div>
    <div style="display:flex; gap:0.5rem; margin-top:1rem;">
      <button type="submit" class="btn btn-success">Create Patient</button>
      <a href="{{ url_for('patients_web.list_patients') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
